<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Become a Host — HomeStay Gallery</title>
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>
    <header class="navbar">

        <a href="/" class="logo logo-image">
            <img src="/images/homestay-gallery-logo.png" alt="Home Stay Gallery">
        </a>

        <nav class="navbar-links">

            <a href="/">Explore</a>

            <a href="/#about">About</a>

            <a href="/#how-it-works">How it works</a>

            <a href="/host.html">Become a Host</a>

            <a href="/host-dashboard.html">Host Dashboard</a>

            <a href="/login.html" class="nav-login" id="authNavLink">Login</a>

        </nav>

        <button class="menu-btn" id="menuBtn">☰</button>

    </header>
    <main class="section narrow">
        <p class="eyebrow">BECOME A HOST</p>
        <h1>List your property</h1>
        <p>Your listing stays private until HomeStay Gallery approves it.</p>
        <form id="propertyForm" class="form-card" enctype="multipart/form-data">
            <label>Property name<input name="propertyName" required></label>
            <label>Location<input name="location" required></label>
            <div class="two">
                <label>
                    Price / night
                    <input name="price" type="number" required>
                </label>

                <label>
                    Rooms
                    <input name="rooms" type="number" required>
                </label>
            </div>

            <div class="offer-section">
                <label class="offer-checkbox">
                    <input type="checkbox" id="offerEnabled" name="offerEnabled">
                    <span>This property has a special offer</span>
                </label>

                <div class="offer-fields" id="offerFields">
                    <label>
                        Offer title
                        <input name="offerTitle" type="text" placeholder="e.g. 20% off for October">
                    </label>

                    <label>
                        Offer discount
                        <input name="offerValue" type="text" placeholder="e.g. 20% OFF">
                    </label>

                    <div class="two">
                        <label>
                            Offer starts
                            <input name="offerStartDate" type="date">
                        </label>

                        <label>
                            Offer ends
                            <input name="offerEndDate" type="date">
                        </label>
                    </div>
                </div>
            </div>
            <label>Description<textarea name="description" rows="6" required></textarea></label>
            <label>Phone<input name="phone" required></label>
            <label>WhatsApp<input name="whatsapp"></label>
            <label>Instagram<input name="instagram" type="url"></label>
            <label>
                Property photos
                <small>Up to 12 images</small>
                <input name="photos" type="file" accept="image/*" multiple>
            </label>
            <label>Host story video <small>Optional, 60–90 seconds</small><input name="video" type="file"
                    accept="video/*"></label>
            <button class="btn" type="submit">Submit changes for approval</button>
            <p id="message"></p>
        </form>
    </main>
    <script src="/js/app.js"></script>
    <script src="/js/edit-property.js"></script>
</body>

</html>
