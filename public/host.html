<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Become a Host — Angan</title>
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>
    <header class="navbar">

    <a href="/" class="logo">
        angan<span>.</span>
    </a>

    <nav class="navbar-links">

        <a href="/">Explore</a>

        <a href="/#about">About</a>

        <a href="/#how-it-works">How it works</a>

        <a href="/host.html">Become a Host</a>

        <a href="/host-dashboard.html">Host Dashboard</a>

        <a href="/login.html" class="nav-login" id="authNavLink">Login</a>

    </nav>

    <button class="menu-btn" id="menuBtn">☰</button>

</header>
    <main class="section narrow">
        <p class="eyebrow">BECOME A HOST</p>
        <h1>List your property</h1>
        <p>Your listing stays private until Angan approves it.</p>
        <form id="propertyForm" class="form-card" enctype="multipart/form-data">
            <label>Property name<input name="propertyName" required></label>
            <label>Location<input name="location" required></label>
            <div class="two"><label>Price / night<input name="price" type="number" required></label><label>Rooms<input
                        name="rooms" type="number" required></label></div>
            <label>Description<textarea name="description" rows="6" required></textarea></label>
            <label>Phone<input name="phone" required></label>
            <label>WhatsApp<input name="whatsapp"></label>
            <label>Instagram<input name="instagram" type="url"></label>
            <label>Property photos <small>Up to 12 images</small><input name="photos" type="file" accept="image/*"
                    multiple required></label>
            <label>Host story video <small>Optional, 60–90 seconds</small><input name="video" type="file"
                    accept="video/*"></label>
            <button class="btn" type="submit">Submit for approval</button>
            <p id="message"></p>
        </form>
    </main>
    <script src="/js/app.js"></script>
<script src="/js/host.js"></script>
</body>

</html>
